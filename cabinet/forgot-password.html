<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Восстановление пароля — Умный Чат</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="#c8ff4d"/>
        <path d="M12 5.5c.5 3 1.8 4.3 4.5 4.5-2.7.2-4 1.5-4.5 4.5-.5-3-1.8-4.3-4.5-4.5 2.7-.2 4-1.5 4.5-4.5z" fill="#081522"/>
      </svg>
      Умный<em>Чат</em>
    </a>
  </div>
  <div class="auth-wrap">
    <div class="card">
      <h1 id="title">Восстановление пароля</h1>
      <p class="sub" id="subtitle">Укажите email, которым регистрировались, — пришлём ссылку для сброса пароля.</p>
      <div class="error" id="error"></div>
      <form id="form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
        <button type="submit" class="btn-primary" id="submitBtn">Прислать ссылку</button>
      </form>
      <div id="doneNotice" style="display:none;">
        <p class="sub">Если такой email зарегистрирован, письмо со ссылкой уже отправлено — проверьте почту.</p>
      </div>
      <p class="switch-link"><a href="login.html">Вернуться ко входу</a></p>
    </div>
  </div>
  <script>
    var errorEl = document.getElementById('error');
    var form = document.getElementById('form');
    var submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Отправляем...';

      fetch('/api/cabinet/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.message || 'Не получилось отправить письмо'); });
          return res.json();
        })
        .then(function () {
          form.style.display = 'none';
          document.getElementById('doneNotice').style.display = 'block';
        })
        .catch(function (err) {
          var msg = typeof err.message === 'string' ? err.message : 'Не получилось отправить письмо.';
          errorEl.textContent = msg;
          errorEl.classList.add('visible');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Прислать ссылку';
        });
    });
  </script>
</body>
</html>
