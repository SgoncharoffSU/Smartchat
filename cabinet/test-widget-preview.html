<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Предпросмотр виджета</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fafafa; }
</style>
</head>
<body>
  <script>
    // Embedded by the cabinet's "Обучение бота" pane inside its own iframe
    // box — position:fixed inside widget.js anchors to THIS iframe's
    // viewport, not the cabinet page's, so the launcher/teaser/chat window
    // render confined to the pane instead of floating over the whole
    // cabinet. Same data-preview mechanism test-chat.html (the public
    // prospect-facing demo link) already uses — real widget.js, real
    // chat.js, not a hand-built approximation of it.
    //
    // This same page is embedded from TWO different panes with two
    // different container widths — cabinet-next's "Обучение бота"
    // (.widget-preview, capped at 460px — under widget.js's own 480px
    // MOBILE_BREAKPOINT) and the legacy cabinet's own "Обучение бота"/
    // "Виджет и приветствие" panes (.training-layout/.settings-layout,
    // which render several hundred px wider on a normal desktop window).
    // data-auto-open only makes sense where the container is ALSO narrow
    // enough to trip widget.js's isMobile() check — auto-opening into its
    // normal (non-mobile) floating-panel behavior in a wide pane would
    // recreate the exact "second, nested chat window" bug this was meant to
    // fix (a small floating panel + a still-visible launcher bubble, inside
    // a much larger, mostly-empty pane), just for the OTHER embedder instead
    // (found by code review — cross-checked both panes' actual CSS widths).
    // So this is opt-in via ?autoopen=1, which only cabinet-next's iframe
    // src passes; the legacy cabinet's own src is unchanged and keeps its
    // original click-to-open behavior exactly as before.
    var params = new URLSearchParams(location.search);
    var botToken = params.get('token');
    var color = params.get('color') || '#4f46e5';
    var autoOpen = params.get('autoopen') === '1';
    var s = document.createElement('script');
    s.src = '/widget.js';
    s.setAttribute('data-bot-token', botToken);
    s.setAttribute('data-color', color);
    s.setAttribute('data-teaser-delay-ms', '1500');
    s.setAttribute('data-preview', 'true');
    if (autoOpen) s.setAttribute('data-auto-open', 'true');
    // Unlike test-chat.html (the public demo link), this page is only ever
    // reached from inside the cabinet's own "Обучение бота" pane — safe to
    // show the "mark as bad" control here. See widget.js/chat.js.
    s.setAttribute('data-owner-testing', 'true');
    document.body.appendChild(s);
  </script>
</body>
</html>
