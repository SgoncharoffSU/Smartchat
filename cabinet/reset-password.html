<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Новый пароль — Умный Чат</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <a class="logo" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="#c8ff4d"/>
        <path d="M12 5.5c.5 3 1.8 4.3 4.5 4.5-2.7.2-4 1.5-4.5 4.5-.5-3-1.8-4.3-4.5-4.5 2.7-.2 4-1.5 4.5-4.5z" fill="#081522"/>
      </svg>
      Умный<em>Чат</em>
    </a>
  </div>
  <div class="auth-wrap">
    <div class="card">
      <h1>Новый пароль</h1>
      <p class="sub" id="subtitle">Придумайте новый пароль для входа в кабинет.</p>
      <div class="error" id="error"></div>
      <form id="form">
        <label for="password">Новый пароль</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" required minlength="8" autocomplete="new-password" />
        <button type="submit" class="btn-primary" id="submitBtn">Сохранить пароль</button>
      </form>
      <p class="switch-link"><a href="login.html">Вернуться ко входу</a></p>
    </div>
  </div>
  <script>
    var token = new URLSearchParams(location.search).get('token');
    var errorEl = document.getElementById('error');
    var form = document.getElementById('form');
    var submitBtn = document.getElementById('submitBtn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    if (!token) {
      form.style.display = 'none';
      document.getElementById('subtitle').style.display = 'none';
      showError('В ссылке нет токена сброса. Проверьте, что вы перешли по полной ссылке из письма.');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.classList.remove('visible');

      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;
      if (password !== password2) {
        showError('Пароли не совпадают.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Сохраняем...';

      fetch('/api/cabinet/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: token, password: password }),
      })
        .then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.message || 'Не получилось сохранить пароль'); });
          return res.json();
        })
        .then(function () {
          location.href = '/cabinet/login.html';
        })
        .catch(function (err) {
          showError(typeof err.message === 'string' ? err.message : 'Ссылка недействительна или уже использована.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Сохранить пароль';
        });
    });
  </script>
</body>
</html>
