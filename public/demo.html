<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>ГлавИнструмент — демо-страница</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 40px;
      background: #f2f2f7; color: #1a1a2e; }
    .card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    h1 { font-size: 20px; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сайт клиента (демо-страница для теста виджета)</h1>
    <p>Это тестовая страница, имитирующая сайт компании, на который встроен «Умный чат для сайта».
       Нажмите на значок 💬 в правом нижнем углу, чтобы начать диалог с ИИ-консультантом.</p>
    <p>Виджет подключается одной строкой и работает поверх любой страницы сайта.</p>
  </div>
  <script src="/widget.js"></script>
</body>
</html>
